name: Burst (错峰采集 · 临时)

# 临时任务：在指定 3 个整点各跑一次国内广告子域采集，用来快速累积参数。
# 时间窗之外到点也会唤醒，但 gate 会立刻退出（成本约 1 秒），不做任何写入。
# 窗口：UTC 20261120 15/16/17 点 = 北京 23:35 / 00:35 / 01:35（共 3 次）
# 过窗后本文件可以直接删除，不影响任何常驻流水线。

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: burst
  cancel-in-progress: false

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 时间窗闸门（窗口外直接退出）
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "手动触发，直接执行"; exit 0
          fi
          now=$(date -u +%Y%m%d%H)
          case "$now" in
            2026112015|2026112016|2026112017) echo "run=1" >> "$GITHUB_OUTPUT"; echo "窗口内：$now" ;;
            *) echo "run=0" >> "$GITHUB_OUTPUT"; echo "窗口外：$now，跳过" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == '1'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == '1'
        with:
          python-version: "3.12"

      - name: 采集国内首方广告子域（扩大根域数）
        if: steps.gate.outputs.run == '1'
        env:
          NOAS_CT_ROOTS: "150"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/discover_cn_ads.py
          python3 tools/discover.py --limit 6 || true

      - name: 提交新增（没有新增就零提交）
        if: steps.gate.outputs.run == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists/candidates.tsv lists/cn_ad_endpoints.txt lists/cn_ad_watch.txt \
                  lists/cn_roots.txt state/ct_cursor.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "本轮无新增"; exit 0
          fi
          echo "新增行数：$(git diff --cached --numstat | awk '{s+=$1} END {print s}')"
          git commit -m "burst: 错峰采集 $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do
            git pull -q -X ours --rebase origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
