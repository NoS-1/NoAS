name: Daily Build (每日重建 · 发布 · 站点)

# 只用 GitHub 自家免费能力，不挂任何第三方平台或 CDN：
#   Actions（公开仓库不限时长）→ 拉公开源 → 自我体检 → 编译 → 硬闸 → 订阅 → DoH 产物 → 回归
#   → data 分支（大文件单 commit，历史不膨胀）→ Release 资产（单包下载，长期留档）
#   → Pages（站点 + 镜像通道，带宽由 GitHub 承担）
# 写操作全程走 git push 与 gh CLI，不消耗 API 配额，也不依赖外部账号。

on:
  schedule:
    - cron: "17 19 * * *"   # 北京 03:17
    - cron: "17 7 * * *"    # 北京 15:17
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "subs/**"
      - "docs/**"
      - "**/*.md"
      - "history/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 1 · 拉取公开规则源
        run: python3 tools/fetch.py

      - name: 2 · 自我体检（按本轮真实拉取结果淘汰坏源 / 吸收合格新源）
        run: python3 tools/evolve.py

      - name: 3 · 编译三档（lite / mid / full）
        run: python3 tools/compile.py

      - name: 3.5 · 自动晋级（单源但名字就是广告的域并入 lite）
        run: |
          python3 tools/promote.py
          python3 tools/compile.py

      - name: 4 · 发布前硬校验
        run: python3 tools/guard.py

      - name: 5 · DoH 产物
        run: |
          python3 tools/build_doh.py
          node --check doh/worker.js

      - name: 6 · 真产物回归
        run: |
          node tests/worker_check.mjs
          node tests/standalone_check.mjs

      - name: 7 · 发布 mid/full 到 data 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish.py --token "$GITHUB_TOKEN"

      - name: 8 · 生成站点数据与 Pages 镜像
        run: python3 tools/report.py

      - name: 9 · 提交（内容没变就零提交）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A subs/lite docs history tools doh/worker.tpl.js sources.tsv lists tests
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "build: 每日重建 $(date -u +%Y%m%d-%H%M)"
            git push
          fi

      - name: 10 · Release 单包（lite+mid+full+DoH）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/noas-pkg && mkdir -p /tmp/noas-pkg
          cp -r subs/* /tmp/noas-pkg/
          mkdir -p /tmp/noas-pkg/doh && cp doh/worker.js serve/standalone.mjs /tmp/noas-pkg/doh/
          cp README.md /tmp/noas-pkg/
          ( cd /tmp/noas-pkg && zip -qr /tmp/noas-snapshot.zip . )
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "NoAS 最新快照" --notes "每日自动重建的规则单包（lite/mid/full + 自建 DoH）"
          gh release upload latest /tmp/noas-snapshot.zip --clobber

      - name: 11 · Pages 部署
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 12 · 留档
        uses: actions/upload-artifact@v4
        with:
          name: noas-subs-and-reports
          path: |
            subs/
            out/compile.json
            history/health.json
            history/evolution.json
          retention-days: 14
