name: Daily Build (每日重建 · 发布 · 站点)

# 只用 GitHub 自家免费能力，不挂任何第三方平台或 CDN：
#   Actions（公开仓库不限时长）→ 拉公开源 → 自我体检 → 编译 → 硬闸 → 订阅 → DoH 产物 → 回归
#   → data 分支（大文件单 commit，历史不膨胀）→ Release 资产（单包下载，长期留档）
#   → Pages（站点 + 镜像通道，带宽由 GitHub 承担）
# 写操作全程走 git push 与 gh CLI，不消耗 API 配额，也不依赖外部账号。

on:
  schedule:
    - cron: "17 19 * * *"   # 北京 03:17
    - cron: "17 1 * * *"    # 北京 09:17
    - cron: "17 7 * * *"    # 北京 15:17
    - cron: "17 13 * * *"   # 北京 21:17
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "subs/**"
      - "docs/**"
      - "**/*.md"
      - "history/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      # 依赖必须显式安装：cdn_deploy / gateway_* / post_deploy_verify 都 import requests，
      # 宿主机没有这个包时表现为"3 次重试全失败"，看起来像 CF 故障，其实是缺依赖。
      - name: 0 · 安装 Python 依赖
        run: python3 -m pip install --disable-pip-version-check -q -r requirements.txt && python3 -c "import requests;print('requests', requests.__version__)"

      # 令牌失效是最安静的故障：CF 步骤历来 continue-on-error，token 过期后构建照样绿、
      # 线上照样跑旧规则。放在最前面显式校验，失效直接红。
      - name: 0 · 凭据健康检查
        run: python3 tools/token_check.py

      # 双保险：配了 GitHub App 就现签 1 小时令牌，没配就回退内置 GITHUB_TOKEN。
      # 未配置时这一步必须完全无副作用，不能挡住任何后续步骤。
      - name: 0.1 · 取 App 令牌（可选）
        id: app
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          set +e
          TOKEN="$(python3 tools/gh_app_token.py 2>/dev/null)"
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
            echo "推送凭据：App 令牌（1 小时有效）"
          else
            echo "token=" >> "$GITHUB_OUTPUT"
            echo "推送凭据：内置 GITHUB_TOKEN（未配置 App）"
          fi

      - name: 0.2 · 挂载推送凭据
        env:
          APP_TOK: ${{ steps.app.outputs.token }}
          FALLBACK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOK" ]; then
            git config --local credential.helper '!f() { echo username=x-access-token; echo "password=$APP_TOK"; }; f'
          else
            git remote set-url origin "https://x-access-token:${FALLBACK}@github.com/${GITHUB_REPOSITORY}.git"
          fi


      # CF 令牌体检：CI 里只读不改（写 secret 需要 PAT，内置 token 无该权限）。
      # 真轮换在本地或凭据齐备时执行；未配置时脚本自行跳过，绝不阻塞构建。
      - name: 0.3 · CF 令牌体检
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_USER_TOKEN: ${{ secrets.CF_USER_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: python3 tools/step_run.py --name "CF 令牌体检" --mode soft --retries 1 -- python3 tools/cf_rotate.py --check

      - name: 1 · 拉取公开规则源
        run: python3 tools/fetch.py

      - name: 1.5 · 源投毒防护（清单卫生 / 内容形状 / 单源 ±60% 突变）
        # 拉完立刻校验形状：源被接管时最典型的特征就是"一夜灌进几十万条"，这一步不通过就不编译。
        run: python3 tools/sources_guard.py --mode required

      - name: 2 · 自我体检（按本轮真实拉取结果淘汰坏源 / 吸收合格新源）
        run: python3 tools/evolve.py

      - name: 2.5 · 自动晋级（单源但名字就是广告的域并入 lite）
        # 必须排在编译前：promote 只依赖本轮抓取结果与 lists/，与 compile 产物无关。
        # 老顺序是"编译 → 晋级 → 再全量编译一遍"，等于把最重的编译白跑两次。
        run: python3 tools/promote.py

      - name: 2.9 · 跨层回灌（L2 路径层 / L3 uBO → L1 DNS 端点例外）
        run: python3 tools/layer_backfill.py --write

      - name: 3 · 编译三档（lite / mid / full）
        run: python3 tools/compile.py --force

      - name: 3.05 · 规模骤降自愈（重抓一次；仍不达标交 guard 判红）
        # 上游偶发返回半截内容会让总量掉 15%+ 并触发护栏红。抖动重抓即可恢复；
        # 真失效重抓后仍低，guard 照红，不掩盖故障。
        run: python3 tools/scale_heal.py

      - name: 3.7 · mid/full 推进 KV（Worker 只内嵌 lite，体积换覆盖）
        # 顺序必须是"编译完 → 推 KV → 构建 Worker"：Worker 只读 KV 里的分档，
        # 推晚了线上会出现"新代码 + 旧规则"。回读 count 不一致直接红。
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/kv_push.py

      - name: 3.55 · 标签台账重建（必须紧跟 compile，否则 guard 会判"标签域不在档位"）
        run: |
          python3 tools/build_tags.py
          python3 tools/build_mixed.py

      - name: 3.58 · D1 状态同步
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/step_run.py --name "D1 状态同步" --mode soft --retries 2 -- python3 tools/d1_init.py

      - name: 3.56 · 观察池影子计时 + 域名信誉评分
        run: |
          # 影子计时器：新发现的低置信域必须先观察够久（14 天 + 复现 2 轮）才准晋级，
          # 超 30 天没复现的直接退役。这是"零误拦"的核心机制，必须紧跟 compile。
          python3 tools/watch_pool.py
          # 信誉评分：多信号加权给每条域打分，score>=70 才够格进 lite（手机默认档）
          python3 tools/reputation.py

      - name: 3.6 · DNS 通道体检与产物（国内 DoH/DoT + aiodns）
        run: |
          # 体检是 best-effort：CI 出网被 DROP 时 TCP 会挂到超时，必须给硬上限，
          # 否则一条通道能吃掉十几分钟，把整轮构建拖死。
          timeout 60 python3 tools/check_channels.py || true   # 恒返回 0，环境异常只标注不阻断
          python3 tools/gen_channels.py
      - name: 4 · 路径层（L2）重建与体检
        run: |
          python3 tools/build_paths.py
          python3 tests/paths_check.py

      - name: 3.95 · 静态检查（soft：风格问题从不上红，只记日志）
        continue-on-error: true
        run: |
          python3 -m tabnanny tools/ tests/ 2>&1 | tail -20
          node --check doh/worker.tpl.js
          npx --yes eslint@9 --config eslint.config.mjs doh/worker.tpl.js pages tests serve 2>&1 | tail -30

      - name: 4 · 发布前硬校验
        run: python3 tools/guard.py

      - name: 5 · DoH 产物
        run: |
          python3 tools/build_doh.py
          node --check doh/worker.js

      - name: 6 · 真产物回归
        run: |
          node tests/worker_check.mjs
          node tests/standalone_check.mjs
          node tests/dns_features_check.mjs     # ECS/TTL/负缓存/v4only/CNAME 多跳/why
          python3 tests/benign_fp.py            # 4444 条业务主域大样本，lite 误伤必须为 0
          node tests/fuzz_check.mjs             # 500 个畸形/截断报文：不得出现未捕获异常
          node tests/cache_iso_check.mjs        # 不同客户端子网不得共用同一条缓存应答

      - name: 6.8 · 同步规则到 CF Pages
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NOAS_VER: ${{ github.run_id }}
        run: python3 tools/step_run.py --name "同步规则到 CF Pages" --mode required --retries 2 -- python3 tools/cdn_deploy.py

      - name: 6.85 · 部署 DoH Worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/step_run.py --name "部署 DoH Worker" --mode required --retries 2 -- python3 tools/deploy_doh.py

      - name: 6.88 · Gateway 三档全量同步
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/step_run.py --name "Gateway 三档全量同步" --mode required --retries 2 -- python3 tools/gateway_all.py --apply

      - name: 6.885 · Gateway 误拦剪枝
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/step_run.py --name "Gateway 误拦剪枝" --mode soft --retries 1 -- python3 tools/gateway_prune.py --apply

      - name: 6.89 · Gateway 对齐校验
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/step_run.py --name "Gateway 对齐校验" --mode required --retries 2 -- python3 tools/gateway_align.py

      - name: 6.9 · Analytics Engine 自检
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/step_run.py --name "Analytics Engine 自检" --mode soft --retries 1 -- python3 tools/ae_selfcheck.py

      - name: 6.95 · AI 复核观察池
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/step_run.py --name "AI 复核观察池" --mode soft --retries 1 -- python3 tools/ai_classify.py

      - name: 6.99 · 发布后端到端验证（真实端点 + CF 回读）
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/step_run.py --name "发布后端到端验证" --mode required --retries 1 -- python3 tools/post_deploy_verify.py

      - name: 6.97 · 免费额度水位（请求 / KV / AE，80% 预警）
        # 三个硬顶都是全账号合计 10 万/天；这里只告警不阻断（真撞墙时上游已先报 1027）。
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/quota_water.py --mode soft --warn-at 80

      - name: 6.98 · 部署健康汇总
        if: always()
        run: python3 tools/deploy_health.py

      - name: 8 · 生成站点数据与 Pages 镜像（含零误拦闭环页）
        run: |
          python3 tools/report.py
          python3 tools/build_precision_page.py
          python3 tools/build_status_page.py || true   # 状态页生成失败不阻断发布（soft）

      - name: 8.5 · 更新成长账本（趋势 / 源贡献 / 学习事件）
        run: python3 tools/growth.py

      - name: 9 · 提交（内容没变就零提交）
        # 降频到每天一次：产物分发走 CF，main 只是备份。每天 4 轮各提交一次会让
        # 历史按 ~1MB/轮 膨胀（一年 1.4GB），把免费的仓库额度白吃掉。
        if: github.event_name == 'push' || github.event.schedule == '17 19 * * *'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 入库的只有「必须的数据」：规则源、lite（小档，克隆即用）、代码与状态台账。
          # 大产物（mid/full、mixed、paths、站点 HTML）一律不进 git —— 它们由 CF Pages 分发，
          # 每轮提交等于按 MB 级烧仓库额度。
          git add -A subs/lite subs/channels history tools doh/worker.tpl.js sources.tsv lists tests state
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "build: 每日重建 $(date -u +%Y%m%d-%H%M)"
          # 兜底：本地还有未暂存改动时 rebase 会直接拒绝（"cannot pull with rebase: You have unstaged changes"），
          # 先 stash 掉。已提交的产物不受影响，这一步只是清场。
          git stash -q || true
          # 自愈：并发推送被拒时最多重试 5 次。rebase 下 -X theirs = 保留本轮新产物；
            # 早前写成 -X ours，在 rebase 里 ours 其实是上游旧产物，会把本轮更新覆盖回去。
          for i in 1 2 3 4 5; do
            if git pull -q -X theirs --rebase origin main && git push -q; then
              echo "推送成功（第 $i 次）"; exit 0
            fi
            echo "推送被拒，重试 $i/5"; sleep $((i*3))
          done
          echo "推送重试 5 次仍失败"; exit 1

      - name: 10 · Release 单包（lite+mid+full+DoH）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/noas-pkg && mkdir -p /tmp/noas-pkg
          # worker.js 是 gitignore 产物：前面没生成（或被清理）时才重建，避免重复打包
          [ -f doh/worker.js ] || python3 tools/build_doh.py
          cp -r subs/* /tmp/noas-pkg/
          mkdir -p /tmp/noas-pkg/doh && cp doh/worker.js serve/standalone.mjs /tmp/noas-pkg/doh/
          cp README.md /tmp/noas-pkg/
          ( cd /tmp/noas-pkg && zip -qr /tmp/noas-snapshot.zip . )
          python3 tools/release_notes.py > /tmp/noas-notes.md
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "NoAS 最新快照"
          gh release edit latest --notes-file /tmp/noas-notes.md
          gh release upload latest /tmp/noas-snapshot.zip --clobber

      # GitHub Pages 部署已停用：站点与订阅全部走 CF Pages（免费无限流量，国内可达）。
      # GitHub 侧只保留 Actions（public 仓库分钟数免费）与 Release 单包。

      # 免费额度守门：Pages 每月 500 次部署，用光就整月发不了新规则。
      # 放在发布之后，不影响产物；逼近告警线则让构建红，触发 Issue 而不是静默耗尽。
      # 每天只留一份可回滚的日期快照（latest 会被覆盖，回滚时需要一个固定点）
      - name: 10.2 · 每日快照 tag
        if: github.event_name == 'push' || github.event.schedule == '17 19 * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y%m%d-%H%M)
          gh release create "snap-$TS" /tmp/noas-snapshot.zip \
            --title "NoAS 快照 $TS" --notes-file /tmp/noas-notes.md || true
          # 只保留最近 5 个快照 tag，避免 tag 无限堆积
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep '^snap-' | tail -n +6 | while read -r t; do gh release delete "$t" -y --delete-tag; done || true

      - name: 10.5 · 仓库体积守卫
        run: |
          SZ=$(du -sm .git | cut -f1)
          printf '{"git_mb": %s}\n' "$SZ" > state/repo_size.json
          echo ".git = ${SZ}MB"
          if [ "$SZ" -gt 400 ]; then
            echo "::warning::.git 已 ${SZ}MB（>400MB），建议历史瘦身：清掉 subs/full、docs/subs 的历史对象"
          fi

      - name: 11.5 · 免费额度守门
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/quota_check.py

      - name: 12 · 留档
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: noas-subs-and-reports
          path: |
            subs/lite/
            subs/mixed/
            subs/channels/
            out/compile.json
            history/health.json
            history/evolution.json
          retention-days: 7
