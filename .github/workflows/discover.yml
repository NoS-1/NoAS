name: Discover (自动发现新规则源)

# 每周两次（周一/周四），用 GitHub 自己的搜索 API 找新清单；验过（≥300 条、与白名单零冲突）才写入候选池。
# 额度友好：4 条查询 × 5 个仓库，一次运行 < 30 次搜索请求；其余全部走 git，不占 API 配额。

on:
  schedule:
    - cron: "40 19 * * 1"   # 北京 周一 03:40
    - cron: "40 19 * * 4"   # 北京 周四 03:40

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 发现并校验候选源
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/discover.py --limit 4
      - name: 自动发现国内 App 首方广告子域（被动 DNS + 证书透明度 + 前缀枚举）
        env:
          NOAS_CT_ROOTS: "60"
        run: python3 tools/discover_cn_ads.py
      - name: 有新增就提交（走 git，不占 API 配额）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists/candidates.tsv lists/cn_ad_endpoints.txt lists/cn_ad_watch.txt lists/cn_roots.txt state/ct_cursor.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "本周无新增候选"
            exit 0
          fi
          git commit -m "discover: 自动新增候选源 $(date -u +%Y%m%d)"
          git push
