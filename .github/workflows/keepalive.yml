name: DoH 预热

# CF Worker 的 isolate 空闲一段时间会被回收，回收后再来一个请求要重新加载 4MB 脚本，
# 首包从 ~30ms 变成几百毫秒。每 10 分钟打一次空查询，把 isolate 维持热态。
# 成本：每天 144 次请求，远低于 Workers 免费档 10 万/天的额度。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 打一次自建 DoH（example.com A）
        run: |
          python3 - <<'PY'
          import struct, urllib.request, time
          q = struct.pack(">HHHHHH", 0x1234, 0x0100, 1, 0, 0, 0) + b"\x07example\x03com\x00" + struct.pack(">HH", 1, 1)
          req = urllib.request.Request("https://noas-doh.199999510.workers.dev/dns-query", data=q,
              headers={"Content-Type": "application/dns-message", "Accept": "application/dns-message"}, method="POST")
          t = time.perf_counter()
          try:
              r = urllib.request.urlopen(req, timeout=10)
              r.read(16)
              print("预热成功 %.0fms http=%d" % ((time.perf_counter() - t) * 1000, r.status))
          except Exception as e:
              print("预热失败（不阻塞）：%s" % e)
          PY
