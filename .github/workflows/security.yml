name: Security (CodeQL)

# 公开仓库的代码扫描是免费的；这里只扫自己的脚本，防止流水线被注入或误删。
on:
  schedule:
    - cron: "0 20 * * 0"   # 每周一 04:00（北京）
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "serve/**"
      - "doh/worker.tpl.js"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
