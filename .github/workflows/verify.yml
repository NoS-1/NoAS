name: Verify (线上产物巡检)

# 每 3 小时用 HTTPS 直连检查线上产物是否可用、是否被同步：
# raw 订阅 / Pages 镜像 / data 分支 / Release 单包。失败即红，由 Alert 流水线自动开 Issue。
# 只发 GET，不消耗 API 配额。

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检查各分发通道
        run: |
          fail=0
          check() {
            code=$(curl -sL -o /tmp/body -w '%{http_code}' --max-time 30 "$1?x=$RANDOM" || true)
            size=$(wc -c </tmp/body)
            echo "$code  ${size}B  $1"
            if [ "$code" != "200" ] || [ "$size" -lt 1000 ]; then
              echo "::error::通道异常 $1"; fail=1
            fi
          }
          check "https://noas-cdn.pages.dev/subs/lite/adguard.txt"
          check "https://noas-cdn.pages.dev/subs/lite/rpz.zone"
          check "https://noas-cdn.pages.dev/subs/lite/hosts.txt"
          check "https://noas-cdn.pages.dev/subs/lite/adguard.txt"
          check "https://noas-cdn.pages.dev/data.json"
          check "https://noas-cdn.pages.dev/subs/mid/adguard.txt"
          check "https://noas-cdn.pages.dev/subs/full/hosts.txt"
          check "https://github.com/NoS-1/NoAS/releases/latest/download/noas-snapshot.zip"
          exit $fail
