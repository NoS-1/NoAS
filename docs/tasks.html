<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoAS · 实时任务看板</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--ok:#3fb950;--run:#d29922;--bad:#f85149;--wait:#58a6ff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif;margin:0;padding:24px 16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:18px}
.num{font-size:44px;font-weight:700;line-height:1}
.num small{font-size:13px;color:var(--dim);font-weight:400;margin-left:6px}
.bars{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.bars span{padding:2px 8px;border:1px solid var(--line);border-radius:999px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.row .n{font-size:14px}
.row .t{color:var(--dim);font-size:12px;margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.st{font-size:12.5px;white-space:nowrap}
.ok{color:var(--ok)}.run{color:var(--run)}.bad{color:var(--bad)}.wait{color:var(--wait)}
.bg-ok{background:var(--ok)}.bg-run{background:var(--run)}.bg-bad{background:var(--bad)}.bg-wait{background:var(--wait)}
a{color:#58a6ff;text-decoration:none}
.foot{color:var(--dim);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>实时任务看板</h1>
  <div class="sub">数据源：GitHub Actions（NoS-1/NoAS）· 每 30 秒自动刷新 · <span id="ts">加载中</span></div>

  <div class="hero">
    <div class="num"><span id="active">–</span><small>个任务在跑</small></div>
    <div class="bars" id="bars"></div>
  </div>

  <div id="list"></div>

  <div class="foot">
    状态含义：排队(pending/queued) · 运行中(in_progress) · 成功 · 失败 · 取消<br>
    本地 Agent 侧的后台任务不在这个接口里，只显示 GitHub 侧的真实执行。
  </div>
</div>

<script>
const REPO = "NoS-1/NoAS";
const API = `https://api.github.com/repos/${REPO}/actions/runs?per_page=30`;

const LABEL = {
  queued:["排队","wait"], pending:["排队","wait"], waiting:["排队","wait"],
  in_progress:["运行中","run"],
};
const CONCL = { success:["成功","ok"], failure:["失败","bad"],
  cancelled:["取消","dim"], skipped:["跳过","dim"], timed_out:["超时","bad"] };

function rel(iso){
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return s + " 秒前";
  if (s < 3600) return Math.floor(s/60) + " 分钟前";
  return Math.floor(s/3600) + " 小时前";
}

async function tick(){
  try{
    const r = await fetch(API, {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const runs = (d.workflow_runs || []).filter(x => !x.name.startsWith("Build Alert"));

    const active = runs.filter(x => ["queued","pending","in_progress","waiting"].includes(x.status));
    document.getElementById("active").textContent = active.length;

    const counts = {};
    for (const x of runs.slice(0,12)){
      const key = x.status === "completed" ? (CONCL[x.conclusion]||["未知","dim"])[0] : (LABEL[x.status]||["?","dim"])[0];
      counts[key] = (counts[key]||0)+1;
    }
    document.getElementById("bars").innerHTML =
      Object.entries(counts).map(([k,v]) => `<span>${k} ${v}</span>`).join("");

    document.getElementById("list").innerHTML = runs.slice(0,12).map(x => {
      let [txt,cls] = x.status === "completed" ? (CONCL[x.conclusion]||["未知","dim"]) : (LABEL[x.status]||["?","dim"]);
      const bg = cls === "ok" ? "bg-ok" : cls === "run" ? "bg-run" : cls === "bad" ? "bg-bad" : cls === "wait" ? "bg-wait" : "";
      return `<div class="row">
        <div>
          <div class="n"><span class="dot ${bg}"></span><a href="${x.html_url}" target="_blank">${x.name}</a></div>
          <div class="t">${x.event} · ${x.head_branch || "-"} · ${rel(x.created_at)}</div>
        </div>
        <div class="st ${cls}">${txt}</div>
      </div>`;
    }).join("") || `<div class="row">暂时读不到数据（可能触发接口限速，等 30 秒）</div>`;

    document.getElementById("ts").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN");
  }catch(e){
    document.getElementById("ts").textContent = "读取失败：" + e.message + "（30 秒后重试）";
  }
}
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
